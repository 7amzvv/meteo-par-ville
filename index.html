<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Météo par ville</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main>
        <h1>Météo par ville</h1>
        <form id="weather-form">
            <label for="city">Ville</label>
            <input id="city" name="city" type="search" required>
            <button type="submit">Rechercher</button>
        </form>
        <p id="status" role="status"></p>
        <ul id="city-results" aria-label="Villes trouvées"></ul>
        <table id="weather-table" hidden>
            <caption id="weather-city"></caption>
            <tbody>
                <tr>
                    <th scope="row">Température</th>
                    <td id="temperature"></td>
                </tr>
                <tr>
                    <th scope="row">Humidité</th>
                    <td id="humidity"></td>
                </tr>
                <tr>
                    <th scope="row">Vent</th>
                    <td id="wind"></td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
