<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Météo par ville</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main>
        <header>
            <h1>Météo par ville</h1>
            <button id="theme-toggle" type="button" aria-pressed="false">Mode sombre</button>
        </header>
        <form id="weather-form" novalidate>
            <label for="city">Ville</label>
            <div class="search">
                <input id="city" name="city" type="search" required>
                <button type="submit">Rechercher</button>
            </div>
        </form>
        <p id="status" role="status"></p>
        <ul id="city-results" aria-label="Villes trouvées"></ul>
        <section id="weather-bulletin" aria-labelledby="weather-city" aria-live="polite" hidden>
            <h2 id="weather-city"></h2>
            <div class="current">
                <div>
                    <p id="temperature"></p>
                    <p id="weather-condition"></p>
                </div>
                <span id="weather-icon" aria-hidden="true"></span>
            </div>
            <dl>
                <div><dt>Humidité</dt><dd id="humidity"></dd></div>
                <div><dt>Vent</dt><dd id="wind"></dd></div>
            </dl>
        </section>
    </main>
</body>
</html>
